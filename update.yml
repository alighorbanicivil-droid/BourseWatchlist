name: update-data

# داده‌ی کانال‌ها را می‌گیرد، در ریپو ذخیره می‌کند و Pages را (شاخه‌ی main، پوشه‌ی root) دوباره می‌سازد.
on:
  schedule:
    - cron: '30 4 * * *'   # هر روز ۰۴:۳۰ UTC (حدود ۰۸:۰۰ تهران)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Update data from channels
        run: node scripts/update.js
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: auto update $(date -u +%F)" && git push)
      - name: Request Pages build
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
